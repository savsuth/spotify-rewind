<svg viewBox="0 0 360 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="early-late-title early-late-desc" data-chart="early-late">
<title id="early-late-title">First year vs latest year: artist shares</title>
<desc id="early-late-desc">Dumbbell chart comparing each artist&#x27;s share of music minutes in the first and the latest 12 complete months.</desc>
<rect width="100%" height="100%" fill="#2d3142"/>
<text x="40" y="32" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SHARE OF MUSIC MINUTES</text>
<line x1="72" y1="48" x2="72" y2="288" stroke="rgba(245,245,245,0.2)" stroke-width="1"/>
<text x="72" y="302" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0%</text>
