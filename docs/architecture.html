<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Rewind architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Spotify Rewind</p>
    <h1>From a streaming-history export to a validated story</h1>
    <svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Spotify Rewind architecture</title>
      <desc id="architecture-desc">Architecture diagram: a Spotify export (or a synthetic export with planted ground truth) is cleaned, analysed and segmented into eras by PELT, turned into stories and validated charts for a static story player, while an evaluator scores synthetic runs against the planted truth.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn before nodes) ===== -->
      <!-- Main flow, row 1 at y=112 -->
      <line x1="190" y1="112" x2="230" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="370" y1="112" x2="410" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="112" x2="590" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="730" y1="112" x2="770" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Synthetic export feeds the same input slot (dashed: alternative path) -->
      <line x1="120" y1="268" x2="120" y2="140" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="130" y="198" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="160" y="207" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAME SCHEMA</text>

      <!-- Analysis -> era detector (down, attach x=460) -->
      <line x1="460" y1="140" x2="460" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="374" y="198" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="207" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MONTHLY SHARES</text>

      <!-- Era detector -> story builder (exit top x=500, enter bottom x=636) -->
      <path d="M500,268 V212 Q500,204 508,204 H628 Q636,204 636,196 V140" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="544" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ERAS</text>

      <!-- Story builder -> chart generator (down, attach x=684) -->
      <line x1="684" y1="140" x2="684" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Chart generator -> story player (enter bottom x=840) -->
      <path d="M730,296 H832 Q840,296 840,288 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Truth and results into the evaluator -->
      <line x1="190" y1="296" x2="230" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="194" y="272" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRUTH</text>
      <line x1="410" y1="296" x2="370" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="372" y="272" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="390" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>

      <!-- ===== Nodes ===== -->
      <!-- Row 1 -->
      <rect x="50" y="84" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="50" y="84" width="140" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spotify export</text>
      <text x="120" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON, any account</text>

      <rect x="230" y="84" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="230" y="84" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest + clean</text>
      <text x="300" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dedupe · tz · privacy</text>

      <rect x="410" y="84" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="410" y="84" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Analysis</text>
      <text x="480" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics · habits</text>

      <rect x="590" y="84" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="590" y="84" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Story builder</text>
      <text x="660" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stories.json</text>

      <rect x="770" y="84" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="770" y="84" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="840" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Story player</text>
      <text x="840" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">static site</text>

      <!-- Row 2 -->
      <rect x="50" y="268" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="50" y="268" width="140" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="120" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Synthetic export</text>
      <text x="120" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">planted truth</text>

      <rect x="230" y="268" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="230" y="268" width="140" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="300" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evaluator</text>
      <text x="300" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">13 checks</text>

      <rect x="410" y="268" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="410" y="268" width="140" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Era detector</text>
      <text x="480" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PELT · bootstrap</text>

      <rect x="590" y="268" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="590" y="268" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chart generator</text>
      <text x="660" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validated SVG</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="372" x2="920" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="40" y="398" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="62" y="407" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal: era detection and ground-truth scoring</text>
      <rect x="300" y="398" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="322" y="407" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Pipeline step</text>
      <rect x="412" y="398" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="434" y="407" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Input</text>
      <line x1="484" y1="403" x2="508" y2="403" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="514" y="407" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Synthetic evaluation path</text>
    </svg>
  </div>
</body>
</html>
